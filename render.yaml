services:
  - type: web
    name: zenhire-api
    runtime: python
    rootDir: backend
    buildCommand: pip install poetry==1.8.2 && poetry config virtualenvs.create false && poetry install --only main --no-interaction
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        value: ""
      - key: ANTHROPIC_API_KEY
        value: ""

databases:
  - name: zenhire-db
    databaseName: zenhire
    user: zenhire
