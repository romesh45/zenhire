version: '3.9'
services:
  api:
    build: ./backend
    ports: ['8000:8000']
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/zenhire
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
    depends_on: [postgres, redis]
    volumes:
      - ./backend:/app
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: zenhire
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: ['pg_data:/var/lib/postgresql/data']
    ports: ['5432:5432']
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
volumes:
  pg_data:
