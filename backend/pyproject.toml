[tool.poetry]
name = "zenhire-api"
version = "0.1.0"
description = "Zenhire AI Candidate Evaluation System — Backend API"
authors = ["Romeshwar K <romeshwar.k45@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = {version = "^0.29.0", extras = ["standard"]}
gunicorn = "^21.2.0"
pydantic = {version = "^2.6.0", extras = ["email"]}
pydantic-settings = "^2.2.0"
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
asyncpg = "^0.29.0"
langgraph = "^0.2.0"
langchain = "^0.3.0"
langchain-openai = "^0.2.0"
litellm = "^1.30.0"
openai = "^1.14.0"
redis = "^5.0.0"
pdfplumber = "^0.10.0"
pymupdf = "^1.24.0"
python-multipart = "^0.0.9"
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
passlib = {version = "^1.7.4", extras = ["bcrypt"]}
pgvector = "^0.2.5"
python-dotenv = "^1.0.0"
greenlet = "^3.4.0"
fastembed = "^0.8.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.4.0"
mypy = "^1.9.0"
pytest = "^8.1.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
