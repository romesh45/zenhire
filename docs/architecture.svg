<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="560" fill="#f8fafc"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Zenhire — AI Candidate Evaluation Pipeline</text>

  <!-- ── Layer 1: Recruiter / Candidate clients ── -->
  <g>
    <rect x="40" y="70" width="160" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="120" y="94" text-anchor="middle" font-size="12" font-weight="600" fill="#0369a1">Recruiter Dashboard</text>
    <text x="120" y="112" text-anchor="middle" font-size="10" fill="#0369a1">Next.js 16 · JWT auth</text>

    <rect x="700" y="70" width="160" height="56" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="780" y="94" text-anchor="middle" font-size="12" font-weight="600" fill="#854d0e">Candidate Portal</text>
    <text x="780" y="112" text-anchor="middle" font-size="10" fill="#854d0e">Next.js 16 · No login</text>
  </g>

  <!-- arrows client → api -->
  <line x1="200" y1="98" x2="310" y2="98" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="700" y1="98" x2="590" y2="98" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Layer 2: FastAPI Gateway ── -->
  <rect x="310" y="70" width="280" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="450" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">FastAPI Gateway</text>
  <text x="450" y="112" text-anchor="middle" font-size="10" fill="#15803d">JWT · Pydantic v2 · BackgroundTasks</text>

  <!-- arrow api → redis -->
  <line x1="450" y1="126" x2="450" y2="168" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Layer 3: Redis session cache ── -->
  <rect x="310" y="168" width="280" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="450" y="188" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Redis Session Cache</text>
  <text x="450" y="205" text-anchor="middle" font-size="10" fill="#92400e">Question plan · State · 4 h TTL</text>

  <!-- arrow redis → agents -->
  <line x1="450" y1="216" x2="450" y2="258" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Layer 4: Three Agents ── -->
  <rect x="50" y="258" width="190" height="78" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="145" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#7e22ce">Resume Agent</text>
  <text x="145" y="296" text-anchor="middle" font-size="10" fill="#7e22ce">GPT-4o via LiteLLM</text>
  <text x="145" y="311" text-anchor="middle" font-size="10" fill="#7e22ce">Structured analysis</text>
  <text x="145" y="326" text-anchor="middle" font-size="10" fill="#7e22ce">skill_gaps · resume_score</text>

  <rect x="355" y="258" width="190" height="78" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="450" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#7e22ce">Interview Agent</text>
  <text x="450" y="296" text-anchor="middle" font-size="10" fill="#7e22ce">GPT-4o-mini via LiteLLM</text>
  <text x="450" y="311" text-anchor="middle" font-size="10" fill="#7e22ce">6 targeted questions</text>
  <text x="450" y="326" text-anchor="middle" font-size="10" fill="#7e22ce">expected_signals · difficulty</text>

  <rect x="660" y="258" width="190" height="78" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="755" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#7e22ce">Evaluator Agent</text>
  <text x="755" y="296" text-anchor="middle" font-size="10" fill="#7e22ce">GPT-4o via LiteLLM</text>
  <text x="755" y="311" text-anchor="middle" font-size="10" fill="#7e22ce">Per-answer scoring</text>
  <text x="755" y="326" text-anchor="middle" font-size="10" fill="#7e22ce">6 dims · hallucination flags</text>

  <!-- arrows agents ↔ gateway (top) -->
  <line x1="145" y1="258" x2="340" y2="140" stroke="#9333ea" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-purple)"/>
  <line x1="755" y1="258" x2="560" y2="140" stroke="#9333ea" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-purple)"/>

  <!-- Arbiter (pure Python, between Interview Agent and Evaluator) -->
  <rect x="355" y="356" width="190" height="56" rx="8" fill="#f0f9ff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="450" y="376" text-anchor="middle" font-size="12" font-weight="700" fill="#0e7490">Arbiter</text>
  <text x="450" y="392" text-anchor="middle" font-size="10" fill="#0e7490">Zero LLM · Pure Python</text>
  <text x="450" y="407" text-anchor="middle" font-size="10" fill="#0e7490">follow_up / proceed</text>

  <line x1="450" y1="336" x2="450" y2="356" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Decision Engine -->
  <rect x="310" y="432" width="280" height="64" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="450" y="455" text-anchor="middle" font-size="13" font-weight="700" fill="#be123c">Decision Engine</text>
  <text x="450" y="472" text-anchor="middle" font-size="10" fill="#be123c">100% deterministic · Zero LLM</text>
  <text x="450" y="487" text-anchor="middle" font-size="10" fill="#be123c">Weighted scoring · Floor checks · Tier</text>

  <line x1="450" y1="412" x2="450" y2="432" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- PostgreSQL + pgvector -->
  <rect x="50" y="390" width="190" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="145" y="415" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">PostgreSQL 16</text>
  <text x="145" y="430" text-anchor="middle" font-size="10" fill="#15803d">+ pgvector (1536-dim)</text>
  <text x="145" y="445" text-anchor="middle" font-size="10" fill="#15803d">HNSW · jobs · sessions</text>
  <text x="145" y="460" text-anchor="middle" font-size="10" fill="#15803d">resumes · evaluations · reports</text>

  <line x1="240" y1="422" x2="310" y2="464" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="145" y1="336" x2="145" y2="390" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="240" y1="297" x2="310" y2="200" stroke="#9333ea" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-purple)"/>

  <!-- Output label -->
  <rect x="660" y="432" width="190" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="755" y="455" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Report Output</text>
  <text x="755" y="472" text-anchor="middle" font-size="10" fill="#475569">tier · final_score</text>
  <text x="755" y="487" text-anchor="middle" font-size="10" fill="#475569">dimension_averages · confidence</text>

  <line x1="590" y1="464" x2="660" y2="464" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="755" y1="336" x2="755" y2="432" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- Legend -->
  <text x="40" y="530" font-size="10" fill="#64748b">── async call</text>
  <line x1="40" y1="544" x2="70" y2="544" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="78" y="548" font-size="10" fill="#64748b">LiteLLM / DB write</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/>
    </marker>
  </defs>
</svg>
